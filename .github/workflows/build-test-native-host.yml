name: Build test Native Messaging Host

on:
  push:
    branches:
      - 'test/notification-icon-unpacked'
  workflow_dispatch:

jobs:
  build-test-host:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish framework-dependent native host
        run: dotnet publish native-host/RegOpenerHost.csproj -c Release --self-contained false -p:PublishSingleFile=false -o publish

      - name: Assemble test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/RegOpenerHost.exe package/RegOpenerHost.exe
          Copy-Item scripts/install-test-nmh.ps1 package/install-test-nmh.ps1
          Set-Content -Path package/TEST_EXTENSION_ID.txt -Value 'lallfogojflmbimobkadfhhaajiiakin'

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: ork-test-nmh-unpacked
          path: package/
